<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="170" role="img" aria-label="slimefrozik — just building things that work">
<defs>

  <linearGradient id="jelly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ffe3"/><stop offset=".42" stop-color="#6aeaa8"/><stop offset="1" stop-color="#22a96c"/></linearGradient>
  <radialGradient id="sfloor" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6aeaa8" stop-opacity=".55"/><stop offset=".7" stop-color="#238636" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <radialGradient id="sbub" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#d4ffe8" stop-opacity=".35"/><stop offset="1" stop-color="#6aeaa8" stop-opacity=".1"/></radialGradient>
  <clipPath id="jellyClip"><rect x="8" y="16" width="104" height="92" rx="32"/></clipPath>

  <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3eb856" stop-opacity=".55"/><stop offset="1" stop-color="#145324" stop-opacity=".15"/></linearGradient>
  <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ee787" stop-opacity=".35"/><stop offset="1" stop-color="#238636" stop-opacity=".08"/></linearGradient>
</defs>
<style><![CDATA[

.look{animation:look 6s ease-in-out infinite}
.mouth{transform-box:fill-box;transform-origin:50% 0%;animation:mouth 2.8s ease-in-out infinite}
.brow{animation:brow 4.2s ease-in-out infinite}
.sb{animation:sbub 5s ease-in infinite;opacity:0}
.bgb{animation:bgb 7s ease-in infinite;opacity:0}
.eqb{transform-box:fill-box;transform-origin:50% 100%;animation:eqb 1s ease-in-out infinite}
@keyframes eqb{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes look{0%,28%,100%{transform:translateX(0)}38%,56%{transform:translateX(-3px)}68%,88%{transform:translateX(3px)}}
@keyframes mouth{0%,100%{transform:scale(1,1)}12%,28%{transform:scale(.86,1.22)}42%{transform:scale(1.18,.78)}}
@keyframes brow{0%,40%,100%{transform:translateY(0)}48%,60%{transform:translateY(-2.5px)}}
@keyframes sbub{0%{transform:translateY(0);opacity:0}20%{opacity:.85}100%{transform:translateY(-38px);opacity:0}}
@keyframes bgb{0%{transform:translateY(0);opacity:0}15%{opacity:.55}100%{transform:translateY(-130px);opacity:0}}

@keyframes w1{from{transform:translateX(0)}to{transform:translateX(-600px)}}
@keyframes w2{from{transform:translateX(-300px)}to{transform:translateX(-900px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes travel{0%{transform:translateX(-70px)}100%{transform:translateX(930px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.12,.88)}12%{transform:translateY(-24px) scale(.92,1.1)}30%{transform:translateY(-44px) scale(.96,1.04)}50%{transform:translateY(-24px) scale(.94,1.06)}70%{transform:translateY(0) scale(1.16,.84)}82%{transform:translateY(0) scale(1,1)}}
.w1{animation:w1 9s linear infinite} .w2{animation:w2 13s linear infinite} .b{animation:bob 3s ease-in-out infinite}
.travel{animation:travel 14s linear infinite}
.body{transform-box:fill-box;transform-origin:50% 100%;animation:hop 1.4s cubic-bezier(.4,0,.3,1) infinite}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blinkEye 4.2s infinite}
@keyframes blinkEye{0%,46%,50%,96%,100%{transform:scaleY(1)}48%,98%{transform:scaleY(.08)}}
]]></style>
<g class="b"><text x="450" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-style="italic" fill="#3d444d">“Code is just a tool to solve problems — no matter how it was written.”</text></g>
<text x="450" y="58" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#59636e">slimefrozik <tspan fill="#56d364">+</tspan> just building things that work</text>
