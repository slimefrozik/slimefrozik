<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280" role="img" aria-label="slimefrozik terminal">
<defs>
  <linearGradient id="slimeOuter" x1="15%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#6be37b"/><stop offset="45%" stop-color="#3eb856"/><stop offset="85%" stop-color="#238636"/><stop offset="100%" stop-color="#145324"/></linearGradient>
  <linearGradient id="slimeCore" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2ea043"/><stop offset="100%" stop-color="#0f441c"/></linearGradient>
  <radialGradient id="bubbleGlow" cx="35%" cy="30%" r="65%"><stop offset="0%" stop-color="#fff" stop-opacity=".85"/><stop offset="40%" stop-color="#9bfab0" stop-opacity=".6"/><stop offset="100%" stop-color="#2ea043" stop-opacity=".2"/></radialGradient>
  <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3eb856" stop-opacity=".45"/><stop offset="55%" stop-color="#238636" stop-opacity=".14"/><stop offset="100%" stop-color="#238636" stop-opacity="0"/></radialGradient>
  <radialGradient id="floor" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3eb856" stop-opacity=".45"/><stop offset="70%" stop-color="#238636" stop-opacity=".1"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="gridMask"><rect x="600" y="38" width="295" height="237" fill="url(#fadeL)"/></mask>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#3eb856" fill-opacity=".5"/></pattern>
  <clipPath id="slimeClip"><rect x="6" y="18" width="80" height="72" rx="20"/></clipPath>
  <clipPath id="coverClip"><rect x="20" y="40" width="620" height="200"/></clipPath>
  <clipPath id="termClip"><rect x="5" y="5" width="890" height="270" rx="12"/></clipPath>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".5"/></filter>
  <g id="note"><ellipse cx="0" cy="0" rx="4.2" ry="3.2" transform="rotate(-20)" fill="#7ee787"/><path d="M3.6 -1.2 V-15 Q9 -12 10 -8" stroke="#7ee787" stroke-width="2" fill="none" stroke-linecap="round"/></g>
</defs>
<style><![CDATA[
@keyframes t1{0%,3%{transform:translateX(0);animation-timing-function:steps(6,end)}7%,94%{transform:translateX(640px)}94.01%,100%{transform:translateX(0)}}
@keyframes t2{0%,8%{transform:translateX(0);animation-timing-function:steps(49,end)}17%,94%{transform:translateX(640px)}94.01%,100%{transform:translateX(0)}}
