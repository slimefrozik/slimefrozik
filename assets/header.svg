<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="230">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>
    <linearGradient id="slimeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56d364" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="shadowGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes slimeSquish {
      0%, 100% {
        transform: translateY(0px) scale(1, 1);
      }
      15% {
        transform: translateY(-24px) scale(0.92, 1.12);
      }
      35% {
        transform: translateY(0px) scale(1.16, 0.84);
      }
      50% {
        transform: translateY(-6px) scale(0.98, 1.03);
      }
      65% {
        transform: translateY(0px) scale(1.06, 0.95);
      }
      80% {
        transform: translateY(0px) scale(1, 1);
      }
    }

    @keyframes shadowPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
      }
      15% {
        transform: scale(0.65);
        opacity: 0.2;
      }
      35% {
        transform: scale(1.22);
        opacity: 0.7;
      }
      50% {
        transform: scale(0.9);
        opacity: 0.45;
      }
      65% {
        transform: scale(1.05);
        opacity: 0.55;
      }
      80% {
        transform: scale(1);
        opacity: 0.5;
      }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .slime-body {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: slimeSquish 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .slime-shadow {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: shadowPulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .cursor {
      animation: blink 0.9s infinite;
      fill: #56d364;
    }

    .prompt-sym { fill: #56d364; font-weight: 700; }
    .cmd { fill: #f0f6fc; font-weight: 600; }
    .output { fill: #8b949e; }
    .accent { fill: #79c0ff; font-weight: 600; }
    .status-ok { fill: #7ee787; font-weight: 600; }
  </style>

  <!-- Terminal Window Container -->
  <rect x="5" y="5" width="790" height="220" rx="10" fill="url(#termGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#shadowGlow)"/>

  <!-- Titlebar -->
  <path d="M 5 15 C 5 9.477 9.477 5 15 5 L 785 5 C 790.523 5 795 9.477 795 15 L 795 38 L 5 38 Z" fill="#161b22"/>
  <line x1="5" y1="38" x2="795" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="24" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="21" r="5.5" fill="#27c93f"/>

  <!-- Title text -->
  <text x="400" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" font-weight="500">slime@frozik:~ (zsh)</text>

  <!-- Terminal Content Lines -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="13">
    <!-- Line 1 -->
    <text x="25" y="72">
      <tspan class="prompt-sym">❯ </tspan>
      <tspan class="cmd">whoami</tspan>
    </text>
    <text x="25" y="93" class="output">
      slimefrozik <tspan fill="#6e7681">•</tspan> tinkerer, game modder &amp; tool builder
    </text>

    <!-- Line 2 -->
    <text x="25" y="125">
      <tspan class="prompt-sym">❯ </tspan>
      <tspan class="cmd">cat</tspan> <tspan fill="#f0f6fc">about.txt</tspan>
    </text>
    <text x="25" y="146" class="output">
      vibecoding stuff that works &amp; breaking things to understand them
    </text>

    <!-- Line 3 -->
    <text x="25" y="178">
      <tspan class="prompt-sym">❯ </tspan>
      <tspan class="cmd">vk-music-saver</tspan> <tspan fill="#79c0ff">--active</tspan>
    </text>
    <text x="25" y="199">
      <tspan class="status-ok">[✓] EXTENSION READY</tspan>
      <tspan class="output"> — downloading high-bitrate audio</tspan>
      <tspan class="cursor"> █</tspan>
    </text>
  </g>

  <!-- Slime Mascot (Right side) -->
  <g transform="translate(680, 115)">
    <!-- Shadow -->
    <ellipse cx="40" cy="82" rx="34" ry="7" fill="#000000" class="slime-shadow"/>

    <!-- Slime Body -->
    <g class="slime-body">
      <!-- Outer slime body -->
      <rect x="6" y="22" width="68" height="58" rx="16" fill="url(#slimeGrad)" stroke="#238636" stroke-width="2.5"/>

      <!-- Inner slime core -->
      <rect x="20" y="36" width="40" height="34" rx="8" fill="#238636" opacity="0.6"/>

      <!-- Highlight gleam top-left -->
      <ellipse cx="22" cy="32" rx="6" ry="3.5" fill="#ffffff" opacity="0.45" transform="rotate(-20 22 32)"/>

      <!-- Left Eye -->
      <rect x="22" y="38" width="9" height="13" rx="4" fill="#0d1117"/>
      <circle cx="24.5" cy="41" r="2.2" fill="#ffffff"/>

      <!-- Right Eye -->
      <rect x="49" y="38" width="9" height="13" rx="4" fill="#0d1117"/>
      <circle cx="51.5" cy="41" r="2.2" fill="#ffffff"/>

      <!-- Cute blush -->
      <ellipse cx="17" cy="54" rx="3" ry="1.5" fill="#ff7b72" opacity="0.6"/>
      <ellipse cx="63" cy="54" rx="3" ry="1.5" fill="#ff7b72" opacity="0.6"/>
    </g>
  </g>
</svg>
