@keyframes t4{0%,28%{transform:translateX(0);animation-timing-function:steps(64,end)}40%,94%{transform:translateX(640px)}94.01%,100%{transform:translateX(0)}}
@keyframes t5{0%,45%{transform:translateX(0);animation-timing-function:steps(24,end)}52%,94%{transform:translateX(640px)}94.01%,100%{transform:translateX(0)}}
@keyframes t6{0%,53%{transform:translateX(0);animation-timing-function:steps(52,end)}68%,94%{transform:translateX(640px)}94.01%,100%{transform:translateX(0)}}
@keyframes p0{0%,70%{opacity:0;transform:translateY(6px)}73%{opacity:1;transform:translateY(0)}94%{opacity:1}94.01%,100%{opacity:0}}
@keyframes p1{0%,74%{opacity:0;transform:translateY(6px)}77%{opacity:1;transform:translateY(0)}94%{opacity:1}94.01%,100%{opacity:0}}
@keyframes p2{0%,78%{opacity:0;transform:translateY(6px)}81%{opacity:1;transform:translateY(0)}94%{opacity:1}94.01%,100%{opacity:0}}
@keyframes p3{0%,82%{opacity:0;transform:translateY(6px)}85%{opacity:1;transform:translateY(0)}94%{opacity:1}94.01%,100%{opacity:0}}

@keyframes fade{0%,90%{opacity:1}94%,99%{opacity:0}100%{opacity:1}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(-24px) scale(.92,1.12)}28%{transform:translateY(-28px) scale(.96,1.05)}42%{transform:translateY(0) scale(1.15,.86)}54%{transform:translateY(-6px) scale(.98,1.02)}68%{transform:translateY(0) scale(1.05,.95)}82%{transform:translateY(0) scale(1,1)}}
@keyframes shadowPulse{0%,100%{transform:scale(1);opacity:.55}18%{transform:scale(.65);opacity:.25}42%{transform:scale(1.25);opacity:.7}54%{transform:scale(.94);opacity:.45}68%{transform:scale(1.06);opacity:.6}82%{transform:scale(1);opacity:.55}}
@keyframes blinkEye{0%,46%,50%,96%,100%{transform:scaleY(1)}48%,98%{transform:scaleY(.08)}}
@keyframes splashL{0%,40%{transform:translate(0,0) scale(0);opacity:0}43%{transform:translate(-14px,-8px) scale(1);opacity:.9}49%{transform:translate(-22px,2px) scale(.6);opacity:0}100%{opacity:0}}
@keyframes splashR{0%,40%{transform:translate(0,0) scale(0);opacity:0}43%{transform:translate(14px,-8px) scale(1);opacity:.9}49%{transform:translate(22px,2px) scale(.6);opacity:0}100%{opacity:0}}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes auraPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}
@keyframes noteUp{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(10px,-62px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(240px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
.cover{animation-duration:14s;animation-iteration-count:infinite}
.txt{animation:fade 14s infinite}
.pill{animation-duration:14s;animation-iteration-count:infinite}
.box{transform-box:fill-box;transform-origin:50% 50%}
.body{transform-box:fill-box;transform-origin:50% 100%;animation:jump 2.8s cubic-bezier(.4,0,.2,1) infinite}
.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadowPulse 2.8s cubic-bezier(.4,0,.2,1) infinite}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blinkEye 4.2s infinite}
.dl{animation:splashL 2.8s cubic-bezier(.2,.8,.4,1) infinite}
.dr{animation:splashR 2.8s cubic-bezier(.2,.8,.4,1) infinite}
.cur{animation:cursor .9s infinite;fill:#56d364}
.aura{transform-box:fill-box;transform-origin:50% 50%;animation:auraPulse 4s ease-in-out infinite}
.note{animation:noteUp 4.2s ease-out infinite;opacity:0}
.spark{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.6s ease-in-out infinite}
.scanline{animation:scan 6s linear infinite}
.live{animation:live 1.8s ease-in-out infinite}
.p{fill:#56d364;font-weight:700} .c{fill:#f0f6fc;font-weight:600} .o{fill:#8b949e} .a{fill:#79c0ff;font-weight:600} .ok{fill:#7ee787;font-weight:700}
]]></style>

