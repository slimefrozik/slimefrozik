<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="230">
  <defs>
    <!-- Terminal gradients -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b" />
      <stop offset="100%" stop-color="#080c12" />
    </linearGradient>

    <!-- Slime outer body gradient -->
    <linearGradient id="slimeOuter" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#6be37b" />
      <stop offset="45%" stop-color="#3eb856" />
      <stop offset="85%" stop-color="#238636" />
      <stop offset="100%" stop-color="#145324" />
    </linearGradient>

    <!-- Slime inner core gradient -->
    <linearGradient id="slimeCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#0f441c" />
    </linearGradient>

    <!-- Bubble gradient -->
    <radialGradient id="bubbleGlow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#9bfab0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.2" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="shadowGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Slime floor caustic glow -->
    <radialGradient id="slimeGlowFloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3eb856" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#238636" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* Main body squish & bounce */
    @keyframes slimeJump {
      0%, 100% {
        transform: translateY(0px) scale(1, 1);
      }
      12% {
        transform: translateY(-28px) scale(0.9, 1.14);
      }
      28% {
        transform: translateY(-34px) scale(0.95, 1.06);
      }
      42% {
        transform: translateY(0px) scale(1.18, 0.82);
      }
      54% {
        transform: translateY(-7px) scale(0.97, 1.03);
      }
      68% {
        transform: translateY(0px) scale(1.06, 0.94);
      }
      82% {
        transform: translateY(0px) scale(1, 1);
      }
    }

    /* Inner core with jelly inertia lag */
    @keyframes coreInertia {
      0%, 100% {
        transform: translateY(0px) scale(1, 1);
      }
      14% {
        transform: translateY(-22px) scale(0.92, 1.1);
      }
      30% {
        transform: translateY(-30px) scale(0.96, 1.04);
      }
      45% {
        transform: translateY(3px) scale(1.15, 0.85);
      }
      58% {
        transform: translateY(-5px) scale(0.98, 1.02);
      }
      72% {
        transform: translateY(1px) scale(1.04, 0.96);
      }
      85% {
        transform: translateY(0px) scale(1, 1);
      }
    }

    /* Floor shadow pulse */
    @keyframes shadowPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.55;
      }
      18% {
        transform: scale(0.6);
        opacity: 0.2;
      }
      42% {
        transform: scale(1.3);
        opacity: 0.75;
      }
      54% {
        transform: scale(0.92);
        opacity: 0.45;
      }
      68% {
        transform: scale(1.08);
        opacity: 0.6;
      }
      82% {
        transform: scale(1);
        opacity: 0.55;
      }
    }

    /* Natural blinking */
    @keyframes eyeBlink {
      0%, 46%, 50%, 96%, 100% {
        transform: scaleY(1);
      }
      48%, 98% {
        transform: scaleY(0.08);
      }
    }

    /* Inner bubbles gentle bobbing */
    @keyframes bubbleBob {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-4px) translateX(1px); }
    }

    /* Impact droplet splashes */
    @keyframes splashLeft {
      0%, 40% { transform: translate(0, 0) scale(0); opacity: 0; }
      43% { transform: translate(-14px, -8px) scale(1); opacity: 0.9; }
      49% { transform: translate(-22px, 2px) scale(0.6); opacity: 0; }
      100% { transform: translate(0, 0) scale(0); opacity: 0; }
    }

    @keyframes splashRight {
      0%, 40% { transform: translate(0, 0) scale(0); opacity: 0; }
      43% { transform: translate(14px, -8px) scale(1); opacity: 0.9; }
      49% { transform: translate(22px, 2px) scale(0.6); opacity: 0; }
      100% { transform: translate(0, 0) scale(0); opacity: 0; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .slime-body {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: slimeJump 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .slime-core {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: coreInertia 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .slime-shadow {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: shadowPulse 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .eye-pair {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: eyeBlink 4.2s infinite;
    }

    .inner-bubble {
      animation: bubbleBob 2s ease-in-out infinite;
    }

    .drop-left {
      animation: splashLeft 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }

    .drop-right {
      animation: splashRight 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }

    .cursor {
      animation: blink 0.9s infinite;
      fill: #56d364;
    }

    .prompt-sym { fill: #56d364; font-weight: 700; }
    .cmd { fill: #f0f6fc; font-weight: 600; }
    .output { fill: #8b949e; }
    .accent { fill: #79c0ff; font-weight: 600; }
    .status-ok { fill: #7ee787; font-weight: 600; }
  </style>

  <!-- Terminal Window Container -->
  <rect x="5" y="5" width="790" height="220" rx="10" fill="url(#termGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#shadowGlow)"/>

  <!-- Titlebar -->
  <path d="M 5 15 C 5 9.477 9.477 5 15 5 L 785 5 C 790.523 5 795 9.477 795 15 L 795 38 L 5 38 Z" fill="#161b22"/>
  <line x1="5" y1="38" x2="795" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="24" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="21" r="5.5" fill="#27c93f"/>

  <!-- Title text -->
  <text x="390" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" font-weight="500">slime@frozik:~ (zsh)</text>

  <!-- Terminal Content Lines -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="13">
    <!-- Line 1 -->
    <text x="25" y="72">
      <tspan class="prompt-sym">❯ </tspan>
      <tspan class="cmd">whoami</tspan>
    </text>
    <text x="25" y="93" class="output">
      slimefrozik <tspan fill="#6e7681">•</tspan> tinkerer, game modder &amp; tool builder
    </text>

    <!-- Line 2 -->
    <text x="25" y="125">
      <tspan class="prompt-sym">❯ </tspan>
      <tspan class="cmd">cat</tspan> <tspan fill="#f0f6fc">about.txt</tspan>
    </text>
    <text x="25" y="146" class="output">
      vibecoding stuff that works &amp; breaking things to understand them
    </text>

    <!-- Line 3 -->
    <text x="25" y="178">
      <tspan class="prompt-sym">❯ </tspan>
      <tspan class="cmd">vk-music-saver</tspan> <tspan fill="#79c0ff">--active</tspan>
    </text>
    <text x="25" y="199">
      <tspan class="status-ok">[+] EXTENSION READY</tspan>
      <tspan class="output"> — downloading high-bitrate audio</tspan>
      <tspan class="cursor"> █</tspan>
    </text>
  </g>

  <!-- Highly Detailed Slime Mascot (Right side) -->
  <g transform="translate(665, 105)">
    <!-- Floor Caustic Ambient Glow -->
    <ellipse cx="46" cy="94" rx="46" ry="12" fill="url(#slimeGlowFloor)" class="slime-shadow"/>

    <!-- Contact Shadow Underneath -->
    <ellipse cx="46" cy="94" rx="38" ry="7.5" fill="#000000" class="slime-shadow"/>

    <!-- Left Splash Droplet -->
    <circle cx="8" cy="92" r="3.2" fill="#56d364" class="drop-left" />

    <!-- Right Splash Droplet -->
    <circle cx="84" cy="92" r="3.2" fill="#56d364" class="drop-right" />

    <!-- Slime Assembly (Animated) -->
    <g class="slime-body">
      <!-- 1. Outer Translucent Jelly Cube (Main Body) -->
      <rect x="6" y="18" width="80" height="72" rx="20" fill="url(#slimeOuter)" stroke="#1a6d2b" stroke-width="2.5"/>

      <!-- 2. Jelly Rim Highlight (Top & Inner Glow) -->
      <rect x="9" y="21" width="74" height="66" rx="17" fill="none" stroke="#7ee787" stroke-width="1.8" opacity="0.45"/>

      <!-- 3. Bottom Dark Ambient Shadow Inside Gel -->
      <path d="M 12 72 Q 46 88 80 72 L 80 76 Q 46 92 12 76 Z" fill="#0a3212" opacity="0.5"/>

      <!-- 4. Floating Inner Nucleus / Core (Inertia Lag) -->
      <g class="slime-core">
        <!-- Core Body -->
        <rect x="22" y="34" width="48" height="42" rx="11" fill="url(#slimeCore)" stroke="#0d3f1a" stroke-width="1.5" opacity="0.8"/>
        <!-- Core Top Highlight -->
        <ellipse cx="46" cy="38" rx="16" ry="4" fill="#56d364" opacity="0.5"/>
      </g>

      <!-- 5. Suspended Micro-Bubbles (Jelly Depth) -->
      <circle cx="21" cy="68" r="4.2" fill="url(#bubbleGlow)" class="inner-bubble"/>
      <circle cx="22.2" cy="67" r="1.2" fill="#ffffff" opacity="0.9"/>

      <circle cx="71" cy="38" r="3.2" fill="url(#bubbleGlow)" class="inner-bubble"/>
      <circle cx="72" cy="37.2" r="0.9" fill="#ffffff" opacity="0.9"/>

      <circle cx="68" cy="74" r="2.4" fill="url(#bubbleGlow)" class="inner-bubble"/>

      <!-- 6. Blinking Eyes -->
      <g class="eye-pair">
        <!-- Left Eye -->
        <g transform="translate(25, 38)">
          <rect x="0" y="0" width="11" height="17" rx="5" fill="#081017"/>
          <!-- Big Gloss Glint -->
          <circle cx="3.8" cy="4.2" r="3" fill="#ffffff"/>
          <!-- Sub Glint Bottom-Right -->
          <circle cx="7.8" cy="12.5" r="1.4" fill="#ffffff" opacity="0.8"/>
        </g>

        <!-- Right Eye -->
        <g transform="translate(56, 38)">
          <rect x="0" y="0" width="11" height="17" rx="5" fill="#081017"/>
          <!-- Big Gloss Glint -->
          <circle cx="3.8" cy="4.2" r="3" fill="#ffffff"/>
          <!-- Sub Glint Bottom-Right -->
          <circle cx="7.8" cy="12.5" r="1.4" fill="#ffffff" opacity="0.8"/>
        </g>

        <!-- Cute Smile Mouth -->
        <path d="M 43 54 Q 46 57 49 54" stroke="#081017" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      </g>

      <!-- 7. Soft Cheeks Blush -->
      <ellipse cx="18" cy="56" rx="4.5" ry="2.2" fill="#ff7b72" opacity="0.65"/>
      <ellipse cx="74" cy="56" rx="4.5" ry="2.2" fill="#ff7b72" opacity="0.65"/>

      <!-- 8. Main Top-Left Specular Surface Gleam (Glassy Reflection) -->
      <path d="M 17 26 Q 36 21 54 26 Q 36 28 17 26 Z" fill="#ffffff" opacity="0.75" />
      <ellipse cx="23" cy="33" rx="7" ry="3.5" fill="#ffffff" opacity="0.55" transform="rotate(-25 23 33)"/>
      <circle cx="33" cy="28" r="2" fill="#ffffff" opacity="0.75"/>
    </g>
  </g>
</svg>
