<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="190" role="img" aria-label="VKMusicSaver — Firefox extension for downloading high-bitrate music from VK">
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3eb856"/><stop offset=".55" stop-color="#30363d"/><stop offset="1" stop-color="#79c0ff"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12301b"/><stop offset="1" stop-color="#0a1a10"/></linearGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#9bfab0" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="cardClip"><rect x="2" y="2" width="896" height="186" rx="16"/></clipPath>
</defs>
<style><![CDATA[
@keyframes eq{0%,100%{transform:scaleY(.18)}50%{transform:scaleY(1)}}
@keyframes sweep{0%{transform:translateX(-300px)}60%,100%{transform:translateX(1200px)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1s ease-in-out infinite}
.sweep{animation:sweep 6s ease-in-out infinite}
.gem{animation:glow 2.4s ease-in-out infinite}
]]></style>
<rect x="2" y="2" width="896" height="186" rx="16" fill="#0d1117" stroke="url(#edge)" stroke-width="1.5"/>
<g clip-path="url(#cardClip)"><rect class="sweep" x="0" y="0" width="260" height="190" fill="url(#sheen)" transform="skewX(-18)"/></g>
<rect x="30" y="34" width="124" height="124" rx="26" fill="url(#tile)" stroke="#238636" stroke-opacity=".6"/>
<g transform="translate(30,60)"><rect class="bar" style="animation-duration:0.9s;animation-delay:-0.00s" x="14" y="22" width="8" height="64" rx="4" fill="#56d364"/><rect class="bar" style="animation-duration:0.6s;animation-delay:-0.17s" x="27" y="22" width="8" height="64" rx="4" fill="#7ee787"/><rect class="bar" style="animation-duration:1.2s;animation-delay:-0.34s" x="40" y="22" width="8" height="64" rx="4" fill="#9bfab0"/><rect class="bar" style="animation-duration:0.75s;animation-delay:-0.51s" x="53" y="22" width="8" height="64" rx="4" fill="#79c0ff"/><rect class="bar" style="animation-duration:1.05s;animation-delay:-0.68s" x="66" y="22" width="8" height="64" rx="4" fill="#9bfab0"/><rect class="bar" style="animation-duration:0.65s;animation-delay:-0.85s" x="79" y="22" width="8" height="64" rx="4" fill="#7ee787"/><rect class="bar" style="animation-duration:0.95s;animation-delay:-1.02s" x="92" y="22" width="8" height="64" rx="4" fill="#56d364"/></g>
<text x="184" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#f0f6fc">VKMusicSaver</text>
<g class="gem"><rect x="760" y="34" width="112" height="26" rx="13" fill="#ffa657" fill-opacity=".12" stroke="#ffa657" stroke-opacity=".6"/>
<text x="816" y="51.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffa657">★ current gem</text></g>
<rect x="184" y="88" width="140" height="24" rx="12" fill="#79c0ff" fill-opacity=".1" stroke="#79c0ff" stroke-opacity=".5"/><text x="254.0" y="104" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#79c0ff">Firefox Extension</text><rect x="332" y="88" width="113" height="24" rx="12" fill="#56d364" fill-opacity=".1" stroke="#56d364" stroke-opacity=".5"/><text x="388.5" y="104" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#56d364">AMO-compliant</text><rect x="453" y="88" width="66" height="24" rx="12" fill="#ffa657" fill-opacity=".1" stroke="#ffa657" stroke-opacity=".5"/><text x="486.0" y="104" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffa657">No ads</text><rect x="527" y="88" width="106" height="24" rx="12" fill="#d2a8ff" fill-opacity=".1" stroke="#d2a8ff" stroke-opacity=".5"/><text x="580.0" y="104" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#d2a8ff">High-bitrate</text>
<text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1"><tspan x="184" y="136">Clean, lightweight add-on that saves music from VK in high bitrate —</tspan><tspan x="184" y="155">no ads, no suspicious extensions, no bloated converters.</tspan></text>
<text x="872" y="174" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#79c0ff">github.com/slimefrozik/VKMusicSaver  →</text>
</svg>