  <text x="96" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#f0f6fc">Browser Extensions</text>
  <text x="96" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#79c0ff">&amp; Web Tools</text>
  <text y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9198a1"><tspan x="26" dy="0">Audio stream extraction,</tspan><tspan x="26" dy="19">clean UI injection,</tspan><tspan x="26" dy="19">automating mundane web tasks.</tspan></text>
</g>
<g transform="translate(306,3)">
