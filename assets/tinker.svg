  <text y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9198a1"><tspan x="26" dy="0">Prompting modern LLMs to craft</tspan><tspan x="26" dy="19">scripts, utilities and tools</tspan><tspan x="26" dy="19">for everyday use.</tspan></text>
