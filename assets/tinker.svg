      <polygon points="1,15 25,28 25,54 1,41" fill="#2ea043"/><polygon points="49,15 25,28 25,54 49,41" fill="#196c2e"/>
      <polygon points="25,2 49,15 25,28 1,15" fill="none" stroke="#b6ffc4" stroke-opacity=".6"/>
      <rect x="9" y="30" width="6" height="6" fill="#0d3f1a" opacity=".55" transform="skewY(30) translate(0,-4)"/></g></g>
  <text x="96" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#f0f6fc">Game Modding</text>
  <text x="96" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#56d364">&amp; Mechanics</text>
  <text y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9198a1"><tspan x="26" dy="0">Minecraft server plugins,</tspan><tspan x="26" dy="19">Terraria mods,</tspan><tspan x="26" dy="19">and game prototypes.</tspan></text>
</g>
<g transform="translate(603,3)">
  <rect width="288" height="174" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="26" y="0" width="56" height="3" rx="1.5" fill="#d2a8ff"/>
