<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180" role="img" aria-label="What I tinker with: browser extensions and web tools, game modding (Minecraft plugins, Terraria mods), vibecoding with LLMs">
<style><![CDATA[
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes tw{0%,100%{transform:scale(.6) rotate(0);opacity:.6}50%{transform:scale(1.1) rotate(20deg);opacity:1}}
.fl{animation:fl 3.2s ease-in-out infinite}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 2s ease-in-out infinite}
.blink{animation:bl 1s infinite}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 2.4s ease-in-out infinite}

.dp{transform-box:fill-box;transform-origin:50% 0%;animation:dripS 5s ease-in-out infinite}
.dd{animation:dropF 5s ease-in infinite;opacity:0}
@keyframes dripS{0%,100%{transform:scaleY(.6)}55%{transform:scaleY(1.12)}}
@keyframes dropF{0%,52%{opacity:0;transform:translateY(0)}58%{opacity:.9}100%{opacity:0;transform:translateY(26px)}}

]]></style>
